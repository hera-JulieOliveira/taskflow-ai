services:
  db:
    image: postgres:16
    container_name: taskflow-db
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - taskflow-data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: taskflow-api
    profiles: ["full"]
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskflow
      DB_USER: taskflow
      DB_PASSWORD: taskflow
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  web:
    build: ./frontend
    container_name: taskflow-web
    profiles: ["full"]
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  taskflow-data:
